<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quest 3 Passthrough Photo Viewer v2</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#111;color:#fff}
#panel{position:fixed;z-index:20;left:16px;top:16px;width:min(430px,calc(100vw - 32px));padding:18px;border-radius:16px;background:rgba(15,15,15,.94);box-sizing:border-box}
h1{font-size:21px;margin:0 0 10px}
p{color:#ccc;line-height:1.35}
label{display:block;margin-top:12px;font-weight:700}
input[type=file],input[type=number],input[type=range],button{width:100%;margin-top:7px;box-sizing:border-box}
input[type=number]{padding:10px;border-radius:9px;border:1px solid #555;background:#222;color:#fff}
button{padding:13px;border:0;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer}
#status{margin-top:10px;color:#aaa;font-size:14px}
#preview{display:none;max-width:160px;max-height:160px;margin-top:10px;border:1px solid #555;background:#333}
.small{font-size:12px;color:#999}
canvas{display:block}
</style>
</head>
<body>
<div id="panel">
  <h1>Quest 3 Passthrough Photo Viewer v2</h1>
  <p>This version places the image only after the XR session has started.</p>

  <label>Transparent PNG</label>
  <input id="file" type="file" accept="image/png,image/webp">
  <img id="preview" alt="preview">

  <label>Real-world height (feet)</label>
  <input id="heightFt" type="number" min="1" max="8" step="0.1" value="5.5">

  <label>Distance: <span id="distanceLabel">2.0</span> m</label>
  <input id="distance" type="range" min="0.7" max="5" step="0.1" value="2.0">

  <button id="enterAR" disabled>Enter Passthrough</button>
  <div id="status">Checking WebXR…</div>
  <p class="small">Your selected image stays local in the browser.</p>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

const fileInput = document.getElementById('file');
const preview = document.getElementById('preview');
const heightFt = document.getElementById('heightFt');
const distance = document.getElementById('distance');
const distanceLabel = document.getElementById('distanceLabel');
const enterAR = document.getElementById('enterAR');
const status = document.getElementById('status');
const panel = document.getElementById('panel');

let renderer, scene, camera, photoMesh, texture;
let imgAspect = 1;
let xrSupported = false;
let localImageURL = null;
let needsXRPlacement = false;

distance.addEventListener('input',()=>distanceLabel.textContent=Number(distance.value).toFixed(1));

scene = new THREE.Scene();
scene.background = null;

camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.01, 100);

renderer = new THREE.WebGLRenderer({
  antialias:true,
  alpha:true,
  preserveDrawingBuffer:false
});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.setClearColor(0x000000,0);
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local');
document.body.appendChild(renderer.domElement);

const material = new THREE.MeshBasicMaterial({
  transparent:true,
  alphaTest:0.01,
  side:THREE.DoubleSide,
  depthTest:true,
  depthWrite:false
});

photoMesh = new THREE.Mesh(new THREE.PlaneGeometry(1,1),material);
photoMesh.visible = false;
scene.add(photoMesh);

function applySize(){
  if(!texture) return;
  const h = Number(heightFt.value)*0.3048;
  const w = h*imgAspect;
  photoMesh.scale.set(w,h,1);
}
heightFt.addEventListener('input',applySize);

fileInput.addEventListener('change',()=>{
  const f=fileInput.files?.[0];
  if(!f)return;

  if(localImageURL) URL.revokeObjectURL(localImageURL);
  localImageURL=URL.createObjectURL(f);

  preview.src=localImageURL;
  preview.style.display='block';

  const img=new Image();
  img.onload=()=>{
    imgAspect=img.naturalWidth/img.naturalHeight;

    new THREE.TextureLoader().load(localImageURL,(tex)=>{
      if(texture)texture.dispose();
      texture=tex;
      texture.colorSpace=THREE.SRGBColorSpace;
      texture.needsUpdate=true;

      photoMesh.material.map=texture;
      photoMesh.material.needsUpdate=true;
      applySize();
      photoMesh.visible=true;
      refreshButton();

      status.textContent = xrSupported
        ? 'Image ready. Enter passthrough.'
        : 'Image ready, but immersive AR was not detected.';
    });
  };
  img.src=localImageURL;
});

function refreshButton(){
  enterAR.disabled=!(xrSupported && texture);
}

async function checkXR(){
  if(!navigator.xr){
    status.textContent='WebXR unavailable. Open this page in Meta Quest Browser.';
    return;
  }
  try{
    xrSupported=await navigator.xr.isSessionSupported('immersive-ar');
    status.textContent=xrSupported
      ? 'Quest immersive AR detected. Choose a PNG.'
      : 'Immersive AR not reported by this browser.';
    refreshButton();
  }catch(e){
    status.textContent='WebXR check failed: '+e.message;
  }
}

function placeInFrontOfHeadset(){
  // Get the actual XR camera AFTER the session begins.
  const xrCamera=renderer.xr.getCamera(camera);

  const worldPos=new THREE.Vector3();
  const worldQuat=new THREE.Quaternion();
  xrCamera.getWorldPosition(worldPos);
  xrCamera.getWorldQuaternion(worldQuat);

  // Forward direction from the headset.
  const forward=new THREE.Vector3(0,0,-1).applyQuaternion(worldQuat);
  // Keep image upright rather than matching head tilt.
  forward.y=0;
  if(forward.lengthSq()<0.0001) forward.set(0,0,-1);
  forward.normalize();

  const d=Number(distance.value);

  // Place center slightly below eye height so a life-size person extends toward the floor.
  const h=Number(heightFt.value)*0.3048;
  const center=worldPos.clone().add(forward.multiplyScalar(d));
  center.y = worldPos.y - Math.max(0, h/2 - 0.80);

  photoMesh.position.copy(center);

  // Face the user, yaw only.
  const target=new THREE.Vector3(worldPos.x, center.y, worldPos.z);
  photoMesh.lookAt(target);

  photoMesh.visible=true;
}

renderer.setAnimationLoop(()=>{
  if(renderer.xr.isPresenting && needsXRPlacement){
    // Waiting until this point is the important v2 change:
    // Quest has supplied a real XR camera pose.
    placeInFrontOfHeadset();
    needsXRPlacement=false;
  }
  renderer.render(scene,camera);
});

enterAR.addEventListener('click',async()=>{
  try{
    applySize();

    const session=await navigator.xr.requestSession('immersive-ar',{
      requiredFeatures:['local'],
      optionalFeatures:['hand-tracking']
    });

    await renderer.xr.setSession(session);
    needsXRPlacement=true;
    panel.style.display='none';

    session.addEventListener('end',()=>{
      panel.style.display='block';
      status.textContent='Passthrough ended. You can enter again.';
    });

  }catch(e){
    panel.style.display='block';
    status.textContent='Could not start passthrough: '+e.message;
  }
});

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

checkXR();
</script>
</body>
</html>
